<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GTA 6 카운트다운</title>
<meta name="theme-color" content="#100b1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GTA 6">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: Rockstar's official phone wallpaper fills the screen with the two leads' faces in the upper half;
   the countdown sits at the bottom over the rooftop, on a dark fade. One row of four units keeps it compact. */
:root{
  --ink:#ffffff; --ink-2:rgba(255,255,255,.78); --ink-3:rgba(255,255,255,.6); --sky:#7b6aa8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--sky);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none}
.bg{position:fixed;inset:0;background:var(--sky) url("bg-phone.jpg") center 74%/cover no-repeat}
@media (min-aspect-ratio:4/5){.bg{background-image:url("bg-wide.jpg");background-position:center 30%}}
.shade{position:fixed;inset:auto 0 0;height:55%;background:linear-gradient(to top,rgba(18,10,36,.92) 0%,rgba(18,10,36,.7) 45%,rgba(18,10,36,0) 100%)}
main{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  text-shadow:0 2px 18px rgba(30,14,60,.45)}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em}
h1 span{font-weight:600;color:var(--ink-2);margin-left:4px}
.count{display:flex;justify-content:center;gap:min(3.2vw,22px)}
.unit{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.unit b{font-size:min(17vw,104px);font-weight:800;line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.unit span{font-size:12px;font-weight:700;letter-spacing:.14em;text-indent:.14em;color:var(--ink-2)}
.when{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.done{font-size:min(15vw,96px);font-weight:900;letter-spacing:-.03em;line-height:1}
.credit{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:10px;color:rgba(255,255,255,.55)}
.tick{animation:tick .45s cubic-bezier(.2,.8,.2,1)}
@keyframes tick{from{opacity:.35;transform:translateY(-8%)}}
@media (prefers-reduced-motion:reduce){.tick{animation:none}}
</style>
</head>
<body>
<div class="bg" role="img" aria-label="GTA VI 공식 아트워크: 옥상 위의 제이슨과 루시아"></div><div class="shade"></div>
<main>
  <h1>GTA 6<span id="sub">출시까지</span></h1>
  <div id="count" class="count">
    <div class="unit" id="dUnit"><b id="d">0</b><span>일</span></div>
    <div class="unit"><b id="h">00</b><span>시간</span></div>
    <div class="unit"><b id="m">00</b><span>분</span></div>
    <div class="unit"><b id="s">00</b><span>초</span></div>
  </div>
  <div class="when" id="when">11월 19일 (목) 00:00 · 한국 시간</div>
</main>
<div class="credit">Artwork © Rockstar Games</div>
<script>
// Rockstar: unlocks at midnight local time on 19 Nov 2026 in every region. Korea (UTC+9) → 2026-11-19 00:00 KST.
const LAUNCH=Date.UTC(2026,10,18,15,0,0);
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const prev={};
function put(id,v){const el=$(id);if(prev[id]===v)return;prev[id]=v;el.textContent=v;el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick')}
function frame(){
  const left=LAUNCH-Date.now();
  if(left<=0){
    $('count').innerHTML='<div class="done">지금 플레이</div>';$('sub').textContent='출시됐어요';
    const since=Math.floor(-left/60000);
    $('when').textContent=since<60?`출시 ${since}분 지남`:since<1440?`출시 ${Math.floor(since/60)}시간 지남`:`출시 ${Math.floor(since/1440)}일 지남`;
    setTimeout(frame,30000);return;
  }
  const t=Math.floor(left/1000),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60;
  $('dUnit').hidden=d===0;
  put('d',String(d));put('h',p2(h));put('m',p2(m));put('s',p2(s));
  setTimeout(frame,1000-Date.now()%1000+5);
}
frame();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){for(const k in prev)delete prev[k];}});
</script>
</body>
</html>
